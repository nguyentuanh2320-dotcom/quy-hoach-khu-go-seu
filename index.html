<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quy hoạch khu Gò Sếu</title>
<link rel="stylesheet" href="leaflet.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'">
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<style>
  :root {
    --bg: #ffffff; --bg2: #f5f7fa; --fg: #1f2933; --muted: #6b7785; --line: #dde2e8; --accent: #1f6feb;
    --panel-w: 340px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1f24; --bg2: #232930; --fg: #e6e9ed; --muted: #9aa5b1; --line: #343b44; --accent: #58a6ff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
  button { font: inherit; color: inherit; }
  #app { display: flex; height: 100%; }
  #panel { width: var(--panel-w); flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--bg); z-index: 1000; }
  #panel { position: relative; }
  #panel header { padding: 14px 44px 10px 16px; border-bottom: 1px solid var(--line); position: relative; }
  #noteBtn { position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 50%; border: 0; padding: 0; background: #f5b301; color: #fff; font: 800 15px/24px system-ui, sans-serif; text-align: center; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .12s, box-shadow .12s; }
  #noteBtn:hover { transform: scale(1.1); box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  #noteBtn[aria-expanded="true"] { box-shadow: 0 0 0 3px color-mix(in srgb, #f5b301 35%, transparent); }
  #noteBtn.bad { background: #e03131; }
  #noteBtn[hidden], #notePop[hidden] { display: none; }
  #notePop { position: absolute; z-index: 1100; top: 48px; left: 10px; right: 10px; max-height: min(70vh, 520px); overflow-y: auto; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.28); padding: 4px 14px 8px; font-size: 12.5px; line-height: 1.5; }
  #notePop::before { content: ''; position: absolute; top: -6px; right: 21px; width: 10px; height: 10px; background: var(--bg); border-left: 1px solid var(--line); border-top: 1px solid var(--line); transform: rotate(45deg); }
  #notePop .np { padding: 8px 0; border-top: 1px solid var(--line); }
  #notePop .np:first-child { border-top: 0; }
  #notePop .np-h { display: flex; align-items: center; gap: 7px; font-weight: 650; font-size: 13px; margin-bottom: 3px; }
  #notePop .np-h i { width: 8px; height: 8px; border-radius: 50%; background: #f5b301; flex: none; }
  #notePop .np.bad .np-h i { background: #e03131; }
  #notePop .np-b { color: var(--muted); }
  #notePop .np-b span { display: inline-block; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 0 8px; margin: 2px 4px 2px 0; color: var(--fg); font-size: 11.5px; }
  #panel h1 { margin: 0; font-size: 17px; font-weight: 650; }
  #panel .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #panel .body { overflow-y: auto; padding: 4px 0 20px; flex: 1; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  #map { flex: 1; min-height: 0; position: relative; z-index: 0; background: #eceae4; }
  #map.measuring { cursor: crosshair; }
  #map.measuring .leaflet-interactive { cursor: crosshair; }

  /* Mục có tam giác thu/mở (kiểu ArcGIS Pro) */
  .tri { display: inline-block; flex: none; width: 0; height: 0; border-left: 6px solid var(--muted); border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; margin: 0 4px 0 2px; transition: transform .12s; cursor: pointer; }
  details.sec > summary, .node > .nrow .tri { user-select: none; }
  details.sec { border-bottom: 1px solid var(--line); padding: 0 16px; }
  details.sec > summary { list-style: none; display: flex; align-items: center; cursor: pointer; padding: 10px 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec[open] > summary .tri, .node.open > .nrow > .tri { transform: rotate(90deg); }
  details.sec > .in { padding: 0 0 12px; }
  #search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
  #search:focus, #aFilter:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 200px; overflow-y: auto; }
  #results li { padding: 5px 8px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  #results li:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  #results small { color: var(--muted); text-align: right; }
  .tree-tools { display: flex; gap: 12px; margin-bottom: 4px; }
  .link { background: none; border: 0; color: var(--accent); padding: 0; cursor: pointer; font-size: 12px; }

  /* Cây nội dung */
  .node > .kids { display: none; }
  .node.open > .kids { display: block; }
  .nrow { display: flex; align-items: center; gap: 5px; min-height: 27px; border-radius: 4px; }
  .nrow:hover { background: var(--bg2); }
  .nrow input[type=checkbox] { margin: 0 2px; flex: none; }
  .nrow .nm { flex: 1; min-width: 0; }
  .grp > .nrow { font-weight: 650; }
  .grp > .nrow .nm { cursor: pointer; }
  .grp > .kids { padding-left: 16px; }
  .lyr > .kids { padding: 2px 0 6px 22px; }
  .lab { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; cursor: pointer; }
  .lab.disabled { opacity: .5; cursor: default; }
  .meta { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .acts { display: none; gap: 0; }
  .nrow:hover .acts { display: flex; }
  .ib { background: none; border: 0; padding: 3px; border-radius: 4px; cursor: pointer; color: var(--muted); display: inline-flex; }
  .ib:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .swatch { width: 18px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.35); flex: none; }
  .swatch.line { height: 0; border: 0; border-top: 3px solid; border-radius: 0; margin: 5px 0; }
  .swatch.dot { width: 12px; height: 12px; border-radius: 50%; margin: 0 3px; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  .oprow { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); padding: 0 0 2px; min-height: 18px; }
  .oprow span { white-space: nowrap; }
  .oprow input[type=range] { flex: none; width: 96px; height: 12px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
  .oprow input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line); border-radius: 1px; }
  .oprow input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 9px; margin-top: -3.5px; border-radius: 50%; background: var(--muted); border: 0; }
  .oprow input[type=range]:hover::-webkit-slider-thumb, .oprow input[type=range]:focus::-webkit-slider-thumb { background: var(--accent); }
  .oprow input[type=range]::-moz-range-track { height: 2px; background: var(--line); border-radius: 1px; }
  .oprow input[type=range]::-moz-range-thumb { width: 9px; height: 9px; border: 0; border-radius: 50%; background: var(--muted); }
  .oprow input[type=range]:focus { outline: none; }
  .cat-row { display: flex; align-items: center; gap: 7px; padding: 2px 0; font-size: 13px; cursor: pointer; }
  .cat-row input { margin: 0; }
  .cat-row .swatch { width: 14px; height: 11px; }
  .cat-row .nm { flex: 1; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { flex: 1; }
  .stat { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .stat span:last-child { font-variant-numeric: tabular-nums; text-align: right; }
  .note { font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--accent) 7%, transparent); border-radius: 6px; padding: 8px 10px; margin-top: 8px; }
  .note b { color: var(--fg); }

  /* Thanh công cụ trên bản đồ */
  #toolbar { position: absolute; z-index: 800; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; background: #fff; color: #1f2933; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.35); padding: 3px; max-width: calc(100% - 140px); }
  #toolbar .tb { display: inline-flex; align-items: center; gap: 5px; padding: 6px 9px; border: 0; background: none; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 13px; color: #1f2933; }
  #toolbar .tb:hover { background: #eef2f7; }
  #toolbar .tb.active { background: #dbe8ff; color: #0b4fc4; }
  #toolbar .sep { width: 1px; align-self: stretch; background: #dde2e8; margin: 3px 3px; }
  #mbox { position: absolute; z-index: 800; top: 58px; left: 50%; transform: translateX(-50%); background: #fff; color: #1f2933; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.35); padding: 8px 12px; font-size: 13px; min-width: 260px; }
  #mbox .mv { font-size: 15px; font-weight: 650; }
  #mbox .mh { color: #6b7785; font-size: 12px; margin-top: 2px; }
  #mbox .mb { display: flex; gap: 8px; margin-top: 6px; }
  #mbox button { border: 1px solid #cbd3dc; background: #f5f7fa; border-radius: 5px; padding: 3px 10px; cursor: pointer; color: #1f2933; }
  #mbox button:hover { background: #e6ecf3; }
  #status { position: absolute; z-index: 800; bottom: 8px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.92); color: #333; border-radius: 6px; padding: 2px 10px; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; cursor: copy; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  #toast { position: absolute; z-index: 1300; left: 50%; bottom: 44px; transform: translateX(-50%); background: #263238; color: #fff; padding: 7px 14px; border-radius: 6px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: 1; }
  #loading { position: fixed; inset: 0; z-index: 1200; background: color-mix(in srgb, var(--bg) 88%, transparent); display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 15px; }
  #loading.hide { display: none; }
  #loading .err { color: #c92a2a; max-width: 460px; }
  #printTitle { display: none; }
  .lyr.loading .nm { color: var(--muted); }
  .gop { padding-left: 0; }
  .glob { margin: 2px 0 8px; }

  /* Bảng thuộc tính */
  #attr { flex: none; height: 38%; min-height: 200px; border-top: 2px solid var(--line); background: var(--bg); display: flex; flex-direction: column; z-index: 900; }
  #attr[hidden] { display: none; }
  .ahead { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .ahead select, .ahead input { padding: 4px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); font: inherit; max-width: 240px; }
  .ahead .sp { flex: 1; }
  .btn { padding: 3px 10px; border: 1px solid var(--line); background: var(--bg2); border-radius: 5px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .awrap { flex: 1; overflow: auto; }
  #aTable { border-collapse: collapse; font-size: 12.5px; width: max-content; min-width: 100%; }
  #aTable th { position: sticky; top: 0; background: var(--bg2); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 5px 10px; text-align: left; white-space: nowrap; cursor: pointer; user-select: none; }
  #aTable td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 3px 10px; white-space: nowrap; }
  #aTable tbody tr { cursor: pointer; }
  #aTable tbody tr:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  #aTable tbody tr.sel { background: color-mix(in srgb, #00b8d9 28%, transparent); }

  /* Nhãn trên bản đồ */
  .lbl { background: transparent; border: 0; }
  .lbl > span { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none; line-height: 1.2; }
  .lbl-canvas { position: absolute; pointer-events: none; }
  .lbl-lot > span, .lbl-sm > span { text-shadow: 1px 0 #fff, -1px 0 #fff, 0 1px #fff, 0 -1px #fff, 1px 1px #fff, -1px -1px #fff; }
  .lbl-lot > span { font-size: 10px; font-weight: 600; color: #111; }
  .lbl-lot .full { display: none; }
  .z-close .lbl-lot .full { display: inline; }
  .z-close .lbl-lot .short { display: none; }
  .lbl-badge > span { background: #fff; color: #111; border: 1px solid #111; border-radius: 999px; padding: 1px 7px; font-size: 11px; font-weight: 700; }
  .lbl-sm > span { font-size: 10px; font-weight: 600; color: var(--c, #333); }
  .lbl-ms > span { background: #d6336c; color: #fff; border-radius: 4px; padding: 0 5px; font-size: 11px; font-weight: 600; }
  .leaflet-control-home { background: #fff; width: 30px; height: 30px; line-height: 30px; text-align: center; font-size: 17px; color: #333; cursor: pointer; display: block; text-decoration: none; }
  .leaflet-control-home:hover { background: #f4f4f4; }
  /* Popup */
  .leaflet-popup-content { margin: 10px 12px; }
  .pp details { border-top: 1px solid #e5e8ec; padding: 4px 0; }
  .pp details:first-child { border-top: 0; }
  .pp summary { cursor: pointer; font-weight: 650; font-size: 13.5px; padding: 3px 0; }
  .pp summary small { font-weight: 500; color: #6b7785; }
  .popup-table { border-collapse: collapse; font-size: 13px; margin: 2px 0 4px; }
  .popup-table td { padding: 3px 6px; border-bottom: 1px solid #e5e8ec; vertical-align: top; }
  .popup-table td:first-child { color: #6b7785; padding-right: 12px; white-space: nowrap; }
  #toggle { display: none; }
  #panelClose, #scrim { display: none; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  @media (pointer: coarse) {
    #sbtab { width: 26px; height: 72px; font-size: 18px; }
    .leaflet-touch .leaflet-bar a { width: 36px; height: 36px; line-height: 36px; }
  }
  @media (min-width: 701px) and (max-width: 1100px) { :root { --panel-w: 300px; } }
  /* ===== Quản trị ===== */
  .adm-only { display: none !important; }
  body.is-admin .adm-only { display: inline-block !important; }
  #toolbar .tb.active[data-tool=admin] { color: #fff; background: #2f9e44; }
  .pp summary .adm, #info summary .adm { color: #1f6feb; }
  #info summary .adm.del { color: #c92a2a; }
  #dlg { position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #dlg[hidden] { display: none; }
  #dlg .card { background: var(--bg); color: var(--fg); border-radius: 10px; width: min(420px, 100%); max-height: 88vh; overflow-y: auto; padding: 18px 20px; box-shadow: 0 6px 30px rgba(0,0,0,.4); }
  #dlg .card.wide { width: min(760px, 100%); }
  #dlg h2 { margin: 0 0 8px; font-size: 17px; }
  #dlg p { margin: 6px 0 10px; }
  #dlg .muted, .muted { color: var(--muted); font-size: 12.5px; }
  #dlg .fld { display: block; margin: 10px 0; }
  #dlg .fld span { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
  #dlg input[type=email], #dlg input[type=password], #dlg input[type=text], #dlg select, #dlg .fadd input, #dlg .fl { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
  .dlg-act { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .dlg-act .sp { flex: 1; }
  .btn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .btn.danger { background: #c92a2a; border-color: #c92a2a; color: #fff; }
  .btn:disabled { opacity: .6; cursor: default; }
  .dlg-err { background: #fff0f0; color: #a61e1e; border: 1px solid #f5c2c2; border-radius: 6px; padding: 6px 9px; margin-top: 8px; font-size: 13px; }
  .adm-help { margin: 4px 0 10px; padding-left: 18px; font-size: 13px; } .adm-help li { margin: 4px 0; } .adm-help svg { vertical-align: -3px; }
  .fwrap { max-height: 46vh; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
  .ftab { border-collapse: collapse; width: 100%; font-size: 13px; }
  .ftab th { position: sticky; top: 0; z-index: 1; background: var(--bg2); text-align: left; padding: 6px 8px; font-weight: 600; white-space: nowrap; }
  .ftab td { padding: 4px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
  .ftab td.c { text-align: center; width: 1%; white-space: nowrap; }
  .ftab .fl { padding: 4px 7px; }
  .ftab tr.gone td { opacity: .45; } .ftab tr.gone code { text-decoration: line-through; }
  .ftab .tag { background: #d3f9d8; color: #2b8a3e; border-radius: 4px; padding: 0 5px; font-size: 11px; }
  .fadd { display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 6px; align-items: center; margin-top: 10px; font-size: 13px; }
  .edit-form { margin: 4px 0 8px; font-size: 13px; }
  .edit-form .ef-meta { color: #6b7785; font-size: 12px; margin-bottom: 4px; }
  .edit-form .ef-row { display: grid; grid-template-columns: 42% 1fr; gap: 6px; align-items: center; padding: 2px 0; }
  .edit-form .ef-row span { color: #52606d; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .edit-form .ef-row.hid span { color: #98a2ad; } .edit-form i { font-style: normal; font-size: 11px; }
  .edit-form input, .edit-form textarea { width: 100%; box-sizing: border-box; padding: 4px 6px; border: 1px solid #cfd6dd; border-radius: 5px; font: inherit; background: #fff; color: #1f2933; }
  .edit-form .ef-act { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; position: sticky; bottom: 0; background: #fff; padding: 6px 0 2px; }
  @media (max-width: 700px) { .fadd { grid-template-columns: 1fr; } .ftab th:nth-child(4), .ftab td:nth-child(4) { display: none; } }
  @media print { #dlg { display: none !important; } }
  /* Bảng thông tin (kiểu cổng quy hoạch) */
  #info { position: absolute; z-index: 850; top: 58px; right: 10px; width: 340px; max-height: calc(100% - 100px); display: flex; flex-direction: column; background: #fff; color: #1f2933; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.4); overflow: hidden; }
  #info[hidden] { display: none; }
  #info .ihead { display: flex; align-items: center; gap: 2px; padding: 6px 6px 6px 12px; border-bottom: 1px solid #e5e8ec; font-size: 14px; }
  #info .ihead .sp { flex: 1; }
  #info .ib { color: #52606d; }
  #info .ibody { overflow-y: auto; padding: 4px 12px 6px; }
  #info .ifoot { padding: 5px 12px; border-top: 1px solid #e5e8ec; font-size: 11.5px; color: #6b7785; font-variant-numeric: tabular-nums; }
  #info details { border-top: 1px solid #e5e8ec; padding: 4px 0; }
  #info details:first-child { border-top: 0; }
  #info summary { cursor: pointer; font-weight: 650; font-size: 13.5px; padding: 3px 0; display: flex; align-items: center; gap: 4px; }
  #info summary small { font-weight: 500; color: #6b7785; }
  #info summary .zb { margin-left: auto; }
  /* Chú giải */
  #legend { position: absolute; z-index: 800; right: 10px; bottom: 30px; width: 230px; max-height: 45%; overflow-y: auto; background: rgba(255,255,255,.96); color: #1f2933; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.35); padding: 8px 10px; font-size: 12.5px; }
  #legend[hidden] { display: none; }
  .lyr.noop .oprow { display: none; }
  #map.info-open #legend { max-height: 38%; }
  #map.info-open:has(#legend:not([hidden])) #info { max-height: calc(62% - 100px); }
  #legend .lg-h { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  #legend .lg-t { display: flex; align-items: center; gap: 7px; margin-top: 5px; font-weight: 600; }
  #legend .lg-c { display: flex; align-items: center; gap: 7px; padding-left: 4px; margin-top: 2px; }
  #legend .swatch { width: 16px; height: 12px; }
  /* Chọn nền bản đồ */
  #bm { position: absolute; z-index: 800; left: 10px; bottom: 38px; display: flex; gap: 6px; }
  .bm-c { width: 68px; height: 50px; border-radius: 6px; border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.45); background: #dfe3e8 center/cover; cursor: pointer; padding: 0; position: relative; overflow: hidden; display: none; }
  .bm-c span { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 10.5px; line-height: 15px; text-align: center; }
  .bm-c.cur { display: block; }
  #bm.open .bm-c { display: block; }
  #bm.open .bm-c.cur { border-color: #1f6feb; }

// Điểm đặt nhãn: đa giác = điểm trong xa biên nhất; đường = trung điểm theo chiều dài; điểm = chính nó
function labelPoint(geom) {
  if (geom.type === 'Point') return L.latLng(geom.coordinates[1], geom.coordinates[0]);
  if (geom.type === 'MultiPoint') return L.latLng(geom.coordinates[0][1], geom.coordinates[0][0]);
  if (geom.type === 'LineString' || geom.type === 'MultiLineString') {
    const len = l => { let s = 0; for (let i = 1; i < l.length; i++) s += Math.hypot(l[i][0] - l[i - 1][0], l[i][1] - l[i - 1][1]); return s; };
    const line = linesOf(geom).reduce((a, b) => len(b) > len(a) ? b : a);
    let half = len(line) / 2;
    for (let i = 1; i < line.length; i++) {
      const d = Math.hypot(line[i][0] - line[i - 1][0], line[i][1] - line[i - 1][1]);
      if (half <= d || i === line.length - 1) { const t = d ? Math.min(1, half / d) : 0; return L.latLng(line[i - 1][1] + (line[i][1] - line[i - 1][1]) * t, line[i - 1][0] + (line[i][0] - line[i - 1][0]) * t); }
      half -= d;
    }
  }
  const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
  const ringArea = r => { let a = 0; for (let i = 0, j = r.length - 1; i < r.length; j = i++) a += (r[j][0] + r[i][0]) * (r[j][1] - r[i][1]); return Math.abs(a / 2); };
  let rings = polys[0];
  polys.forEach(p => { if (ringArea(p[0]) > ringArea(rings[0])) rings = p; });
  const inside = (x, y) => {
    let c = false;
    for (const r of rings) for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
      const [xi, yi] = r[i], [xj, yj] = r[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  };
  const dist = (x, y) => {
    let d = Infinity;
    for (const r of rings) for (let i = 0, j = r.length - 1; i < r.length; j = i++) d = Math.min(d, segDist(x, y, r[j][0], r[j][1], r[i][0], r[i][1]));
    return d;
  };
  const xs = rings[0].map(c => c[0]), ys = rings[0].map(c => c[1]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  let best = { x: (x0 + x1) / 2, y: (y0 + y1) / 2, d: -1 };
  const N = 16;
  for (let round = 0; round < 4; round++) {
    for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
      const x = x0 + (x1 - x0) * i / N, y = y0 + (y1 - y0) * j / N;
      if (!inside(x, y)) continue;
      const d = dist(x, y);
      if (d > best.d) best = { x, y, d };
    }
    const w = (x1 - x0) / 4, h = (y1 - y0) / 4;
    x0 = best.x - w; x1 = best.x + w; y0 = best.y - h; y1 = best.y + h;
  }
  return L.latLng(best.y, best.x);
}

/* ===================== NẠP DỮ LIỆU ===================== */
async function loadLayer(def) {
  try {
    const r = await fetch(def.id + '.geojson');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    return (j.features || []).filter(f => f.geometry && f.geometry.coordinates && f.geometry.coordinates.length);
  } catch (e) { def.error = String(e.message || e); return null; }
}

function catName(def, f) {
  if (!def.cat) return null;
  const raw = f.properties[def.cat];
  if (isEmpty(raw)) return '(chưa phân loại)';
  const t = String(raw).trim();
  return (def.catNames && def.catNames[t]) || t;
}

function computeCore() {
  let b = [Infinity, Infinity, -Infinity, -Infinity];
  CONFIG.CORE.forEach(id => (byId[id].raw || []).forEach(f => { f._bb = bboxOf(f.geometry); b = [Math.min(b[0], f._bb[0]), Math.min(b[1], f._bb[1]), Math.max(b[2], f._bb[2]), Math.max(b[3], f._bb[3])]; }));
  if (isFinite(b[0])) coreBounds = L.latLngBounds([b[1], b[0]], [b[3], b[2]]);
}
function ingest(def) {
  const ext = coreBounds, buf = CONFIG.EXTENT_BUFFER_DEG;
  def.outside = 0;
  def.feats = (def.raw || []).filter(f => {
    if (!f._bb) f._bb = bboxOf(f.geometry);
    if (!ext) return true;
    const cx = (f._bb[0] + f._bb[2]) / 2, cy = (f._bb[1] + f._bb[3]) / 2;
    const ok = cx > ext.getWest() - buf && cx < ext.getEast() + buf && cy > ext.getSouth() - buf && cy < ext.getNorth() + buf;
    if (!ok) def.outside++;
    return ok;
  });
  def.raw = null;
  def.empty = !def.error && def.feats.length === 0 && def.outside === 0;
  def.loaded = true;
  computeCats(def);
}
function computeCats(def) {
  if (def.cat) {
    const m = new Map();
    def.feats.forEach(f => {
      f._cat = catName(def, f);
      const e = m.get(f._cat) || { name: f._cat, n: 0 };
      e.n++; m.set(f._cat, e);
    });
    def.cats = [...m.values()].sort((a, b) => b.n - a.n);
    let k = 0;
    def.cats.forEach(c => { c.color = (def.colors && def.colors[c.name]) || PALETTE[k++ % PALETTE.length]; });
    def.catColor = Object.fromEntries(def.cats.map(c => [c.name, c.color]));
  }
}

/* ===================== VẼ LỚP ===================== */
function styleOf(def, f) {

  if (def.geom === 'polygon') return { stroke: def.weight > 0, color: def.stroke, weight: def.weight, opacity: k, fill: def.fill !== false, fillColor: c, fillOpacity: def.fillOpacity * k, dashArray: def.dash || null };

}
// Tất cả lớp vẽ chung 1 canvas (1 pane) thay vì mỗi lớp 1 canvas toàn màn hình → zoom/kéo nhanh hơn nhiều.

    VEC = L.canvas({ pane, padding: 0.12 });

  def.gl = L.geoJSON(null, {
    pane: 'vec', renderer: VEC, interactive: false,
    style: f => styleOf(def, f),
    pointToLayer: (f, ll) => L.circleMarker(ll, { pane: 'vec', renderer: VEC, interactive: false })
  });
}
let orderQ = false;
function fixOrder() {
  if (orderQ) return; orderQ = true;
  requestAnimationFrame(() => {
    orderQ = false;
    defs.filter(d => d.on && d._drawn).sort((a, b) => a.order - b.order).forEach(d => d.gl.eachLayer(l => l.bringToFront()));

}
const visibleFeats = def => def.feats.filter(f => !def.hidden.has(f._cat));

  def.gl.clearLayers();
  def.gl.addData({ type: 'FeatureCollection', features: visibleFeats(def) });
  def._lgDirty = true;
  if (def.on && def._drawn) fixOrder();
}
function setOn(def, on) {
  def.on = on;
  if (on) { if (!def._drawn) { redraw(def); def._drawn = true; } def.gl.addTo(map); fixOrder(); }
  else map.removeLayer(def.gl);
  document.querySelectorAll(`.lyr[data-id="${def.id}"]`).forEach(row => { row.querySelector('.lab input').checked = on; });
  def.groups.forEach(syncGroup);
  updateLabels(); updateStats(); syncHash();
}
function syncGroup(g) {
  const node = [...document.querySelectorAll('.grp')].find(n => n.dataset.g === g);
  if (!node) return;
  const list = defs.filter(d => d.groups.includes(g) && !d.empty && !d.error);
  const n = list.filter(d => d.on).length, c = node.querySelector('.gchk');
  c.checked = n === list.length && n > 0; c.indeterminate = n > 0 && n < list.length;
}
function zoomLayer(def) {
  if (!def.feats.length) return;
  let b = [Infinity, Infinity, -Infinity, -Infinity];
  def.feats.forEach(f => { b = [Math.min(b[0], f._bb[0]), Math.min(b[1], f._bb[1]), Math.max(b[2], f._bb[2]), Math.max(b[3], f._bb[3])]; });
  S.userMoved = true;
  map.fitBounds([[b[1], b[0]], [b[3], b[2]]], { padding: [40, 40], maxZoom: 20 });
  if (!def.on) setOn(def, true);
}

/* ===================== NHÃN =====================
   Vẽ toàn bộ nhãn lên MỘT canvas (thay vì hàng trăm phần tử HTML) → kéo/zoom mượt.
   Canvas phủ rộng hơn khung nhìn 1 khoảng đệm, vẽ lại khi dừng kéo/zoom; ẩn trong lúc zoom động. */
const LBL = { cv: null, pad: 0.35, q: false };
function initLabelCanvas() {
  if (LBL.cv) return;
  LBL.cv = L.DomUtil.create('canvas', 'lbl-canvas', map.getPane('labels'));
  map.on('moveend zoomend resize viewreset', drawLabels);
  map.on('zoomstart', () => { LBL.cv.style.visibility = 'hidden'; });
  map.on('zoomend', () => { LBL.cv.style.visibility = ''; });
}
function labelText(lb, p, close) {
  if (lb.txt) return lb.txt(p, close);
  const h = lb.html(p); return isEmpty(h) ? null : String(h);
}
function updateLabels() {
  initLabelCanvas();
  const z = map.getZoom();
  map.getContainer().classList.toggle('z-close', z >= 20);
  defs.forEach(def => {
    if (!def.label || !def.gl) return;
    const lb = def.label;
    def._lgOn = def.on && S.labels && z >= lb.min && z < lb.max;
    if (!def._lgOn) return;
    if (!def._li || def._lgDirty) {
      def._li = [];
      visibleFeats(def).forEach(f => {
        const p = f.properties;
        if (isEmpty(labelText(lb, p, false)) && isEmpty(labelText(lb, p, true))) return;
        def._li.push({ ll: L.latLng(labelPoint(f.geometry)), p });
      });
      def._lgDirty = false;
    }
  });

}
function drawLabels() {
  if (!LBL.cv || LBL.q) return; LBL.q = true;
  requestAnimationFrame(() => { LBL.q = false; drawLabelsNow(); });
}
function drawLabelsNow() {
  const cv = LBL.cv, sz = map.getSize(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const px = Math.round(sz.x * LBL.pad), py = Math.round(sz.y * LBL.pad);
  const W = sz.x + 2 * px, H = sz.y + 2 * py;
  const origin = map.containerPointToLayerPoint([-px, -py]);
  L.DomUtil.setPosition(cv, origin);
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
  const ctx = cv.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const z = map.getZoom(), close = z >= 20;
  const bd = L.latLngBounds(map.containerPointToLatLng([-px, sz.y + py]), map.containerPointToLatLng([sz.x + px, -py]));
  defs.filter(d => d._lgOn && d._li).sort((a, b) => a.order - b.order).forEach(def => {
    const lb = def.label, badge = lb.cls === 'lbl-badge';
    ctx.font = badge ? `700 11px ${FONT}` : `600 10px ${FONT}`;
    def._li.forEach(it => {
      if (!bd.contains(it.ll)) return;
      const t = labelText(lb, it.p, close); if (isEmpty(t)) return;
      const c = map.latLngToContainerPoint(it.ll), x = c.x + px, y = c.y + py;
      if (badge) {
        const w = ctx.measureText(t).width + 14, h = 16;
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - w / 2, y - h / 2, w, h, 8) : ctx.rect(x - w / 2, y - h / 2, w, h);
        ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = '#111'; ctx.stroke();
        ctx.fillStyle = '#111'; ctx.fillText(t, x, y + .5);
      } else {
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(t, x, y);
        ctx.fillStyle = lb.color || (lb.cls === 'lbl-lot' ? '#111' : '#333'); ctx.fillText(t, x, y);
      }
    });
  });
}

/* ===================== BẤM VÀO BẢN ĐỒ (IDENTIFY) ===================== */
function hitTest(ll) {
  const z = map.getZoom(), kx = Math.cos(ll.lat * Math.PI / 180);
  const degPerPx = 156543.03392 * kx / Math.pow(2, z) / 111320;
  const tolLine = 7 * degPerPx, tolPt = 10 * degPerPx;
  const hits = [];
  defs.forEach(def => {
    if (!def.on || !def.feats.length) return;
    const tol = def.geom === 'line' ? tolLine : tolPt;
    let best = null, bestD = Infinity;
    for (const f of def.feats) {
      if (def.hidden.has(f._cat)) continue;
      const bb = f._bb;
      if (def.geom === 'polygon') {
        if (ll.lng < bb[0] || ll.lng > bb[2] || ll.lat < bb[1] || ll.lat > bb[3]) continue;
        if (pointInGeom(f.geometry, ll.lng, ll.lat)) hits.push({ def, f, rank: 20 + def.hitPri });
      } else {
        if (ll.lng < bb[0] - tol / kx || ll.lng > bb[2] + tol / kx || ll.lat < bb[1] - tol || ll.lat > bb[3] + tol) continue;
        let d = Infinity;
        if (def.geom === 'line') linesOf(f.geometry).forEach(l => { for (let i = 1; i < l.length; i++) d = Math.min(d, segDist(ll.lng * kx, ll.lat, l[i - 1][0] * kx, l[i - 1][1], l[i][0] * kx, l[i][1])); });
        else pointsOf(f.geometry).forEach(p => { d = Math.min(d, Math.hypot((ll.lng - p[0]) * kx, ll.lat - p[1])); });
        if (d <= tol && d < bestD) { best = f; bestD = d; }
      }
    }
    if (best) hits.push({ def, f: best, rank: (def.geom === 'point' ? 0 : 10) + def.hitPri });
  });
  return hits.sort((a, b) => a.rank - b.rank);
}

function fmtVal(k, v) {
  const meta = FIELDS[k];
  if (meta && meta[1] && !isNaN(Number(v))) return `${nf(v, 2)} ${meta[1]}`;
  if (typeof v === 'number') return nf(v, 2);
  return String(v);
}
function rowsOf(def, f) {
  const p = f.properties, rows = [];
  if (def.cat && !isEmpty(f._cat) && (def.cat !== 'phanLoai' || !(def.key && def.key(p) === f._cat))) rows.push(['Loại', String(f._cat), true]);
  for (const [k, v] of Object.entries(p)) {
    if (isEmpty(v) || fieldHidden(def, k) || k === def.cat) continue;
    rows.push([fieldLabel(def, k), fmtVal(k, v)]);
  }
  if (def.geom === 'polygon' && isEmpty(p.dienTich) && !isEmpty(p.Shape_Area)) rows.push(['Diện tích (hình học)', nf(p.Shape_Area, 1) + ' m²']);
  if (def.geom === 'line' && isEmpty(p.chieuDai) && !isEmpty(p.Shape_Length)) rows.push(['Chiều dài (hình học)', nf(p.Shape_Length, 1) + ' m']);

}

  return `<details${open ? ' open' : ''} data-i="${idx}"><summary>${esc(def.title)}${isEmpty(key) ? '' : ` <small>· ${esc(key)}</small>`}<button class="ib zb" data-a="zoom" data-i="${idx}" title="Phóng tới đối tượng">${svg(ICON.zoom, 15)}</button>${DB.admin ? `<button class="ib zb adm" data-a="edit" data-i="${idx}" title="Sửa thuộc tính">${svg(ICON.edit, 15)}</button><button class="ib zb adm del" data-a="del" data-i="${idx}" title="Xóa đối tượng">${svg(ICON.trash, 15)}</button>` : ''}</summary><table class="popup-table">${rows}</table></details>`;

function layerNode(def, g = def.group) {

// Giao cắt (overlay) hai lớp vùng: ma trận diện tích nhóm A × nhóm B
async function anOverlay() {
  const A = byId[AN.ov.a], B = byId[AN.ov.b];

  const mat = new Map(), cols = new Set(), res = []; let fail = 0, pairs = 0;
  visibleFeats(A).forEach(fa => {
    visibleFeats(B).forEach(fb => {
      const a = fa._bb, b = fb._bb; if (a[0] > b[2] || a[2] < b[0] || a[1] > b[3] || a[3] < b[1]) return;

  const cl = [...cols].sort((x, y) => String(x).localeCompare(String(y), 'vi', { numeric: true })), rl = [...mat.keys()].sort((x, y) => String(x).localeCompare(String(y), 'vi', { numeric: true }));
  const colTot = new Map(cl.map(c => [c, 0])); let grand = 0;
  const csv = [[A.title + ' \\ ' + B.title, ...cl, 'Tổng (m2)']];
  const rowsHtml = rl.map(r => {
    const row = mat.get(r); let rt = 0;
    const tds = cl.map(c => { const v = row.get(c) || 0; rt += v; colTot.set(c, colTot.get(c) + v); return `<td class="n">${v ? nf(v, 1) : ''}</td>`; }).join('');
    grand += rt; csv.push([r, ...cl.map(c => Math.round((row.get(c) || 0) * 100) / 100), Math.round(rt * 100) / 100]);
    return `<tr><td>${esc(r)}</td>${tds}<td class="n"><b>${nf(rt, 1)}</b></td></tr>`;
  }).join('');
  csv.push(['Tổng (m2)', ...cl.map(c => Math.round(colTot.get(c) * 100) / 100), Math.round(grand * 100) / 100]);
  $('anOut').innerHTML = `<div class="sumline">${esc(A.title)} × ${esc(B.title)} — đơn vị m²</div>${rl.length ? `<table class="rt"><thead><tr><th>A \\ B</th>${cl.map(c => `<th class="n">${esc(c)}</th>`).join('')}<th class="n">Tổng</th></tr></thead><tbody>${rowsHtml}<tr class="tot"><td>Tổng</td>${cl.map(c => `<td class="n">${nf(colTot.get(c), 1)}</td>`).join('')}<td class="n">${nf(grand, 1)}</td></tr></tbody></table>` : '<div class="hint">Hai lớp không chồng lên nhau.</div>'}<div class="hint">${fmtN(pairs)} cặp đối tượng được kiểm tra${fail ? `, ${fail} cặp lỗi hình học bị bỏ qua` : ''}. Diện tích tính trên mặt cầu (WGS84), có thể lệch nhẹ so với số liệu hồ sơ.</div>`;
  AN.csv = csv; AN.g.clearLayers();
  if (AN.ov.draw && res.length) L.geoJSON(res, { pane: 'ana', interactive: false, style: { color: '#c2255c', weight: 1, fillColor: '#e64980', fillOpacity: .4 } }).addTo(AN.g);

function parseCoord(q) {
  const m = /^\s*(-?\d+(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.,]\d+)?)\s*$/.exec(q);

  let a = parseFloat(m[1].replace(',', '.')), b = parseFloat(m[2].replace(',', '.'));
  let lat = a, lng = b;
  if (Math.abs(a) > 90 || (Math.abs(b) <= 90 && b < a && a > 100)) { lat = b; lng = a; }
  return Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? L.latLng(lat, lng) : null;
}
function runSearch(q) {

  if (ll) {
    const li = el('li', '', `<span>Đến toạ độ</span><small>${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}</small>`);
    li.addEventListener('click', () => {

}

/* ===================== ĐO ĐẠC ===================== */
const M = { mode: null, pts: [], done: false, g: null };
const fmtLen = m => m >= 1000 ? nf(m / 1000, 3) + ' km' : nf(m, 1) + ' m';
function areaOf(pts) {   // diện tích (m²) theo phép chiếu phẳng cục bộ — đủ chính xác cho khu vực nhỏ
  const lat0 = pts.reduce((s, p) => s + p.lat, 0) / pts.length, lng0 = pts[0].lng, kx = 111320 * Math.cos(lat0 * Math.PI / 180), ky = 110574;
  const xy = pts.map(p => [(p.lng - lng0) * kx, (p.lat - lat0) * ky]);
  let a = 0; for (let i = 0, j = xy.length - 1; i < xy.length; j = i++) a += xy[j][0] * xy[i][1] - xy[i][0] * xy[j][1];
  return Math.abs(a / 2);
}
function pathLen(pts, close) { let s = 0; for (let i = 1; i < pts.length; i++) s += pts[i - 1].distanceTo(pts[i]); if (close && pts.length > 2) s += pts[pts.length - 1].distanceTo(pts[0]); return s; }
function measureStart(mode) {
  const same = M.mode === mode && !M.done;
  anCancel(); measureClear();
  if (same) return;
  M.mode = mode; M.pts = []; M.done = false;
  map.getContainer().classList.add('measuring'); map.doubleClickZoom.disable();
  document.querySelector(`[data-tool=${mode === 'area' ? 'marea' : 'mlen'}]`).classList.add('active'); closeInfo();
  $('mbox').hidden = false; measureDraw();
}
function measureClear() {
  M.mode = null; M.pts = []; M.done = false;
  if (M.g) M.g.clearLayers();
  map.getContainer().classList.remove('measuring'); setTimeout(() => map.doubleClickZoom.enable(), 350);
  document.querySelectorAll('[data-tool=mlen],[data-tool=marea]').forEach(b => b.classList.remove('active'));
  $('mbox').hidden = true;
}
function measureFinish() {
  if (!M.mode || M.done) return;
  if (M.pts.length < (M.mode === 'area' ? 3 : 2)) { measureClear(); return; }
  M.done = true; map.getContainer().classList.remove('measuring'); setTimeout(() => map.doubleClickZoom.enable(), 350);
  document.querySelectorAll('[data-tool=mlen],[data-tool=marea]').forEach(b => b.classList.remove('active'));

}
function measureDraw(extra) {

  const style = { pane: 'measure', color: '#d6336c', weight: 3, fillColor: '#d6336c', fillOpacity: .15, interactive: false };
  if (pts.length >= 2) (M.mode === 'area' && pts.length >= 3 ? L.polygon(pts, style) : L.polyline(pts, style)).addTo(M.g);
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    L.marker(L.latLng((a.lat + b.lat) / 2, (a.lng + b.lng) / 2), { pane: 'labels', interactive: false, icon: L.divIcon({ className: 'lbl lbl-ms', html: `<span>${fmtLen(a.distanceTo(b))}</span>`, iconSize: [0, 0] }) }).addTo(M.g);
  }
  M.pts.forEach(p => L.circleMarker(p, { pane: 'measure', radius: 4.5, color: '#d6336c', weight: 2, fillColor: '#fff', fillOpacity: 1, interactive: false }).addTo(M.g));

  $('mbox').innerHTML = `<div class="mv">${v}</div><div class="mh">${h}${hint ? ' · ' + hint : ''}</div><div class="mb">${M.done ? '' : '<button id="mDone">Hoàn tất</button>'}<button id="mClear">Xóa</button></div>`;
}

/* ===================== QUẢN TRỊ (Supabase) =====================
   - Ai cũng ĐỌC được các chỉnh sửa (bảng feature_edits, layer_schema) → bản đồ luôn hiện dữ liệu mới nhất.
   - Chỉ tài khoản có trong bảng admins mới GHI được (Row Level Security phía Supabase chặn mọi người khác).
   - Không dùng thư viện ngoài: gọi thẳng REST API của Supabase (Auth + PostgREST). */
const DB = {
  url: String(CONFIG.SUPABASE_URL || '').replace(/\/+$/, ''), key: CONFIG.SUPABASE_ANON_KEY || '',
  session: null, admin: false, edits: new Map(), schema: {}, loadError: null
};
const LOCKED = new Set(['OBJECTID', 'Shape_Length', 'Shape_Area']);   // trường hệ thống: không sửa / không xóa
const SS_KEY = 'goseu_admin_session';
function dbOn() { return !!(DB.url && DB.key); }
const oidOf = f => (f.properties && f.properties.OBJECTID != null) ? f.properties.OBJECTID : f.id;
const editKey = (layer, oid) => layer + '#' + oid;

async function dbFetch(path, { method = 'GET', body, auth = false, prefer, timeout = 15000 } = {}) {
  if (auth) await dbFreshen();
  const h = { apikey: DB.key };
  if (auth && DB.session) h.Authorization = 'Bearer ' + DB.session.access_token;   // khách: chỉ gửi apikey (hợp lệ với cả khoá anon cũ lẫn publishable mới)
  if (body !== undefined) h['Content-Type'] = 'application/json';
  if (prefer) h.Prefer = prefer;
  const ac = new AbortController(), to = setTimeout(() => ac.abort(), timeout);
  let r;
  try { r = await fetch(DB.url + path, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body), signal: ac.signal }); }
  catch (e) { throw new Error(e.name === 'AbortError' ? 'hết thời gian chờ máy chủ' : 'không kết nối được máy chủ'); }
  finally { clearTimeout(to); }
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { /* không phải JSON */ }
  if (!r.ok) {
    const m = (j && (j.error_description || j.msg || j.message || j.error)) || ('HTTP ' + r.status);
    const err = new Error(r.status === 401 || r.status === 403 || /row-level security|permission denied/i.test(m) ? 'Không có quyền thực hiện (cần đăng nhập tài khoản quản trị)' : m);
    err.status = r.status; throw err;
  }
  return j;
}

/* ---------- Tải chỉnh sửa lúc mở trang (tối đa 6 s, lỗi thì vẫn hiện dữ liệu gốc) ---------- */
function dbLoad() {
  if (!dbOn()) return Promise.resolve();
  const job = Promise.all([
    dbFetch('/rest/v1/feature_edits?select=layer_id,oid,props,deleted&limit=100000').then(rows => (rows || []).forEach(r => DB.edits.set(editKey(r.layer_id, r.oid), r))),
    dbFetch('/rest/v1/layer_schema?select=layer_id,cfg').then(rows => (rows || []).forEach(r => { DB.schema[r.layer_id] = r.cfg || {}; }))
  ]).catch(e => { DB.loadError = e.message; });
  return Promise.race([job, new Promise(r => setTimeout(() => { if (!DB.edits.size) DB.loadError = DB.loadError || 'máy chủ phản hồi chậm'; r(); }, 6000))]);
}
const cfgOf = def => DB.schema[def.id] || {};
function applySchema(def, feats) {
  const c = cfgOf(def);
  (feats || []).forEach(f => {
    (c.removed || []).forEach(k => { delete f.properties[k]; });
    (c.added || []).forEach(a => { if (!(a.k in f.properties)) f.properties[a.k] = null; });
  });
}
function applyEdits(def, feats) {
  if (!feats) return feats;
  const out = [];
  for (const f of feats) {
    const e = DB.edits.get(editKey(def.id, oidOf(f)));
    if (e && e.deleted) continue;
    if (e && e.props) f.properties = Object.assign({}, f.properties, e.props);
    out.push(f);
  }
  applySchema(def, out);
  return out;
}

/* ---------- Trường: nhãn, ẩn/hiện ---------- */
function fieldLabel(def, k) { const c = cfgOf(def); return (c.labels && c.labels[k]) || (FIELDS[k] || [k])[0]; }
function fieldHiddenDefault(def, k) { return HIDE.has(k) && !(k === 'ghiChu' && def.showNote); }
function fieldHidden(def, k) { const c = cfgOf(def); if ((c.show || []).includes(k)) return false; if ((c.hide || []).includes(k)) return true; return fieldHiddenDefault(def, k); }
function attrHidden(def, k) { const c = cfgOf(def); if ((c.show || []).includes(k)) return false; if ((c.hide || []).includes(k)) return true; return ATTR_HIDE.has(k); }
function fieldsOf(def) { const seen = new Set(), out = []; def.feats.forEach(f => Object.keys(f.properties).forEach(k => { if (!seen.has(k)) { seen.add(k); out.push(k); } })); (cfgOf(def).added || []).forEach(a => { if (!seen.has(a.k)) { seen.add(a.k); out.push(a.k); } }); return out; }
const fieldIsNum = (def, k) => def.feats.some(f => typeof f.properties[k] === 'number') || !!(FIELDS[k] && FIELDS[k][1]);
const protectedField = (def, k) => LOCKED.has(k) || k === def.cat || k === def.search;

/* ---------- Đăng nhập ---------- */
function saveSession() { try { if (DB.session) localStorage.setItem(SS_KEY, JSON.stringify(DB.session)); else localStorage.removeItem(SS_KEY); } catch (e) { /* trình duyệt chặn lưu trữ */ } }
function setSession(j) {
  DB.session = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Math.floor(Date.now() / 1000) + (j.expires_in || 3600), email: j.user && j.user.email, uid: j.user && j.user.id };
  saveSession();
}
async function authToken(grant, body) {
  const r = await fetch(`${DB.url}/auth/v1/token?grant_type=${grant}`, { method: 'POST', headers: { apikey: DB.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const m = j.error_description || j.msg || j.message || ('HTTP ' + r.status);
    throw new Error(/invalid login credentials|invalid_grant/i.test(m + (j.error || '')) && grant === 'password' ? 'Sai email hoặc mật khẩu' : /email not confirmed/i.test(m) ? 'Email chưa được xác nhận' : m);
  }
  return j;
}
async function dbFreshen() {
  if (!DB.session || DB.session.expires_at - 60 > Date.now() / 1000) return;
  try { setSession(await authToken('refresh_token', { refresh_token: DB.session.refresh_token })); }
  catch (e) { DB.session = null; DB.admin = false; saveSession(); admApplyUI(); throw new Error('Phiên đăng nhập đã hết hạn, hãy đăng nhập lại'); }
}
async function admCheck() {
  const rows = await dbFetch(`/rest/v1/admins?select=user_id&user_id=eq.${encodeURIComponent(DB.session.uid)}`, { auth: true });
  DB.admin = Array.isArray(rows) && rows.length > 0;
  return DB.admin;
}
async function admLogin(email, password) {
  setSession(await authToken('password', { email, password }));
  if (!(await admCheck())) { await admLogout(true); throw new Error('Tài khoản này không có quyền quản trị'); }
  admApplyUI();
}
async function admLogout(silent) {
  const s = DB.session;
  DB.session = null; DB.admin = false; saveSession(); admApplyUI();
  if (s) fetch(DB.url + '/auth/v1/logout', { method: 'POST', headers: { apikey: DB.key, Authorization: 'Bearer ' + s.access_token } }).catch(() => {});
  if (!silent) toast('Đã đăng xuất');
}
async function admRestore() {
  if (!dbOn()) return;
  let s = null; try { s = JSON.parse(localStorage.getItem(SS_KEY) || 'null'); } catch (e) { /* bỏ qua */ }
  if (!s || !s.refresh_token) return;
  DB.session = s;
  try { await dbFreshen(); if (await admCheck()) admApplyUI(); else await admLogout(true); }
  catch (e) { DB.session = null; DB.admin = false; saveSession(); admApplyUI(); }
}
function admApplyUI() {
  document.body.classList.toggle('is-admin', DB.admin);
  const b = $('admBtn');
  if (b) { b.classList.toggle('active', DB.admin); b.innerHTML = `${svg(DB.admin ? ICON.user : ICON.lock)}<span class="t">${DB.admin ? 'Quản trị' : 'Đăng nhập'}</span>`; b.title = DB.admin ? `Đang đăng nhập: ${DB.session.email || ''}` : 'Đăng nhập quản trị'; }
  if (INFO.hits.length) openInfo(INFO.ll, INFO.hits);   // vẽ lại popup để hiện/ẩn nút sửa, xóa
  if (A.def && !$('attr').hidden) renderAttr();
}

/* ---------- Hộp thoại dùng chung ---------- */
function dlg(html, { wide = false } = {}) {
  let d = $('dlg');
  if (!d) {
    d = el('div', ''); d.id = 'dlg'; d.hidden = true; document.body.appendChild(d);
    d.addEventListener('mousedown', e => { if (e.target === d) dlgClose(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !d.hidden) dlgClose(); });
  }
  d.innerHTML = `<div class="card${wide ? ' wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  d.hidden = false;
  const first = d.querySelector('input:not([type=checkbox]),select,textarea,button.primary'); if (first) setTimeout(() => first.focus(), 30);
  return d.querySelector('.card');
}
function dlgClose() { const d = $('dlg'); if (d) { d.hidden = true; d.innerHTML = ''; } }
function confirmDlg(title, msg, okText = 'Xóa') {
  return new Promise(res => {
    const c = dlg(`<h2>${esc(title)}</h2><p>${msg}</p><div class="dlg-act"><button class="btn" data-x="no">Hủy</button><button class="btn danger primary" data-x="ok">${esc(okText)}</button></div>`);
    c.addEventListener('click', e => { const x = e.target.closest('[data-x]'); if (!x) return; dlgClose(); res(x.dataset.x === 'ok'); });
  });
}

function admLoginDlg() {
  const c = dlg(`<h2>Đăng nhập quản trị</h2><p class="muted">Chỉ tài khoản quản trị mới thêm, sửa, xóa được dữ liệu. Người xem bình thường không cần đăng nhập.</p>
    <form id="lgForm" autocomplete="on"><label class="fld"><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
    <label class="fld"><span>Mật khẩu</span><input type="password" name="password" autocomplete="current-password" required></label>
    <div class="dlg-err" hidden></div>
    <div class="dlg-act"><button type="button" class="btn" data-x="cancel">Hủy</button><button type="submit" class="btn primary">Đăng nhập</button></div></form>`);
  c.querySelector('[data-x=cancel]').addEventListener('click', dlgClose);
  const form = c.querySelector('#lgForm'), err = c.querySelector('.dlg-err'), sub = form.querySelector('[type=submit]');
  form.addEventListener('submit', async e => {
    e.preventDefault(); err.hidden = true; sub.disabled = true; sub.textContent = 'Đang đăng nhập…';
    try { await admLogin(form.email.value.trim(), form.password.value); dlgClose(); toast('Đã đăng nhập quản trị'); }
    catch (ex) { err.textContent = ex.message; err.hidden = false; sub.disabled = false; sub.textContent = 'Đăng nhập'; }
  });
}
function admMenu() {
  const layers = defs.filter(d => d.loaded && !d.error && d.feats.length).sort((a, b) => a.title.localeCompare(b.title, 'vi'));
  const c = dlg(`<h2>Quản trị dữ liệu</h2><p class="muted">Đang đăng nhập: <b>${esc(DB.session.email || '')}</b></p>
    <ul class="adm-help"><li><b>Sửa / xóa đối tượng:</b> bấm vào đối tượng trên bản đồ → nút ${svg(ICON.edit, 14)} hoặc ${svg(ICON.trash, 14)} trong bảng thông tin.</li>
    <li><b>Thêm / xóa / ẩn hiện trường:</b> chọn lớp bên dưới → “Quản lý trường” (hoặc nút cùng tên trong Bảng thuộc tính).</li>
    <li><b>Xuất GeoJSON đã sửa:</b> trong “Quản lý trường” hoặc nút “Tải GeoJSON” của Bảng thuộc tính.</li></ul>
    <label class="fld"><span>Lớp</span><select id="admLayer">${layers.map(d => `<option value="${d.id}">${esc(d.title)}</option>`).join('')}</select></label>
    <div class="dlg-act"><button class="btn" data-x="out">Đăng xuất</button><span class="sp"></span><button class="btn" data-x="close">Đóng</button><button class="btn primary" data-x="fields">Quản lý trường</button></div>`);
  c.addEventListener('click', e => {
    const x = e.target.closest('[data-x]'); if (!x) return;
    if (x.dataset.x === 'close') dlgClose();
    else if (x.dataset.x === 'out') { dlgClose(); admLogout(); }
    else if (x.dataset.x === 'fields') admFieldsDlg(byId[c.querySelector('#admLayer').value]);
  });
}

/* ---------- Sau khi dữ liệu một lớp thay đổi: cập nhật mọi nơi đang hiển thị ---------- */
function admRefreshLayer(def) {
  def.feats.forEach(f => { f._bb = f._bb || bboxOf(f.geometry); });
  computeCats(def);
  def._lgDirty = true; def._li = null;
  if (def._drawn) redraw(def);
  document.querySelectorAll(`.lyr[data-id="${def.id}"]`).forEach(old => {
    const n = layerNode(def, old.dataset.g); if (old.classList.contains('open')) n.classList.add('open');
    old.replaceWith(n); n.querySelector('.lab input').checked = def.on;
  });
  searchIndex = searchIndex.filter(s => s.def !== def); addSearch(def);
  updateLabels(); updateStats(); updateLegend();
  if (A.def === def && !$('attr').hidden) renderAttr();
}

/* ---------- Sửa thuộc tính một đối tượng ---------- */
function admEditForm(h, idx) {
  const { def, f } = h, p = f.properties;
  const keys = fieldsOf(def).filter(k => !LOCKED.has(k));
  const sec = $('info').querySelector(`details[data-i="${idx}"]`); if (!sec) return;
  sec.open = true;
  const tbl = sec.querySelector('.popup-table, .edit-form'); if (!tbl) return;
  const form = el('form', 'edit-form');
  form.innerHTML = `<div class="ef-meta">OBJECTID ${esc(oidOf(f))}</div>` + keys.map(k => {
    const v = p[k], num = fieldIsNum(def, k), long = !num && typeof v === 'string' && v.length > 40;
    const inp = long ? `<textarea data-k="${esc(k)}" rows="2">${esc(v)}</textarea>` : `<input data-k="${esc(k)}" ${num ? 'type="number" step="any"' : 'type="text"'} value="${isEmpty(v) ? '' : esc(v)}">`;
    return `<label class="ef-row${fieldHidden(def, k) ? ' hid' : ''}"><span title="${esc(k)}">${esc(fieldLabel(def, k))}${fieldHidden(def, k) ? ' <i>(ẩn)</i>' : ''}</span>${inp}</label>`;
  }).join('') + `<div class="dlg-err" hidden></div><div class="ef-act"><button type="button" class="btn" data-x="cancel">Hủy</button><button type="submit" class="btn primary">Lưu</button></div>`;
  tbl.replaceWith(form);
  form.querySelector('[data-x=cancel]').addEventListener('click', () => openInfo(INFO.ll, INFO.hits));
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const err = form.querySelector('.dlg-err'), sub = form.querySelector('[type=submit]'); err.hidden = true;
    const diff = {};
    form.querySelectorAll('[data-k]').forEach(i => {
      const k = i.dataset.k, raw = i.value.trim();
      let v = raw === '' ? null : raw;
      if (v !== null && fieldIsNum(def, k)) { const n = Number(raw.replace(',', '.')); if (isFinite(n)) v = n; }
      const old = isEmpty(p[k]) ? null : p[k];
      if (String(v) !== String(old)) diff[k] = v;
    });
    if (!Object.keys(diff).length) { openInfo(INFO.ll, INFO.hits); toast('Không có thay đổi'); return; }
    sub.disabled = true; sub.textContent = 'Đang lưu…';
    try { await admSaveFeature(def, f, diff); openInfo(INFO.ll, INFO.hits); toast(`Đã lưu ${Object.keys(diff).length} thay đổi`); }
    catch (ex) { err.textContent = 'Không lưu được: ' + ex.message; err.hidden = false; sub.disabled = false; sub.textContent = 'Lưu'; }
  });
  const first = form.querySelector('[data-k]'); if (first) first.focus();
}
async function admSaveFeature(def, f, diff) {
  const oid = oidOf(f), k = editKey(def.id, oid), prev = DB.edits.get(k);
  const props = Object.assign({}, prev && prev.props, diff);
  await dbFetch('/rest/v1/feature_edits?on_conflict=layer_id,oid', { method: 'POST', auth: true, prefer: 'resolution=merge-duplicates,return=minimal', body: [{ layer_id: def.id, oid, props, deleted: false }] });
  DB.edits.set(k, { layer_id: def.id, oid, props, deleted: false });
  Object.assign(f.properties, diff);
  admRefreshLayer(def);
  if (INFO.hits.some(h => h.f === f)) setHighlight(f);
}
async function admDeleteFeature(def, f) {
  const key = keyOf(def, f);
  const ok = await confirmDlg('Xóa đối tượng?', `Xóa <b>${esc(def.title)}${isEmpty(key) ? '' : ' · ' + esc(key)}</b> (OBJECTID ${esc(oidOf(f))}) khỏi bản đồ cho mọi người xem.<br><span class="muted">Có thể khôi phục từ nhật ký thay đổi (bảng edit_log) trên Supabase.</span>`);
  if (!ok) return;
  const oid = oidOf(f), k = editKey(def.id, oid), prev = DB.edits.get(k);
  try {
    await dbFetch('/rest/v1/feature_edits?on_conflict=layer_id,oid', { method: 'POST', auth: true, prefer: 'resolution=merge-duplicates,return=minimal', body: [{ layer_id: def.id, oid, props: (prev && prev.props) || {}, deleted: true }] });
  } catch (ex) { toast('Không xóa được: ' + ex.message); return; }
  DB.edits.set(k, { layer_id: def.id, oid, props: (prev && prev.props) || {}, deleted: true });
  def.feats = def.feats.filter(x => x !== f);
  INFO.hits = INFO.hits.filter(h => h.f !== f);
  admRefreshLayer(def);
  if (INFO.hits.length) openInfo(INFO.ll, INFO.hits); else closeInfo();
  toast('Đã xóa đối tượng');
}

/* ---------- Quản lý trường của một lớp ---------- */
function admFieldsDlg(def) {
  if (!def) return;
  const c0 = cfgOf(def);
  const st = { labels: Object.assign({}, c0.labels), added: (c0.added || []).map(a => Object.assign({}, a)), removed: [...(c0.removed || [])], vis: {}, del: new Set() };
  const keys = fieldsOf(def);
  keys.forEach(k => { st.vis[k] = !(fieldHidden(def, k) && attrHidden(def, k)); });
  const vis0 = Object.assign({}, st.vis);
  const filled = k => def.feats.filter(f => !isEmpty(f.properties[k])).length;
  const card = dlg(`<h2>Quản lý trường · ${esc(def.title)}</h2>
    <p class="muted">Bỏ chọn “Hiện” để ẩn trường khỏi bảng thông tin và bảng thuộc tính (dữ liệu vẫn giữ). “Tên hiển thị” để trống = dùng tên mặc định. Trường có khoá 🔒 là trường hệ thống / dùng để tô màu, tìm kiếm nên không xóa được.</p>
    <div class="fwrap"><table class="ftab"><thead><tr><th>Trường</th><th>Tên hiển thị</th><th>Hiện</th><th>Có dữ liệu</th><th></th></tr></thead><tbody></tbody></table></div>
    <div class="fadd"><b>Thêm trường mới</b><input id="faKey" placeholder="tenTruong (chữ không dấu, số, _)" maxlength="40"><input id="faLabel" placeholder="Tên hiển thị (VD: Chủ sở hữu)" maxlength="80"><button class="btn" id="faBtn">Thêm</button></div>
    <div class="dlg-err" hidden></div>
    <div class="dlg-act"><button class="btn" data-x="export" title="Tải toàn bộ đối tượng của lớp (kể cả trường đang ẩn) sau khi đã sửa">Xuất GeoJSON đã sửa</button><span class="sp"></span><button class="btn" data-x="cancel">Hủy</button><button class="btn primary" data-x="save">Lưu</button></div>`, { wide: true });
  const tb = card.querySelector('tbody'), err = card.querySelector('.dlg-err');
  const render = () => {
    const all = [...keys, ...st.added.map(a => a.k).filter(k => !keys.includes(k))];
    tb.innerHTML = all.map(k => {
      const lock = protectedField(def, k), gone = st.del.has(k), isNew = st.added.some(a => a.k === k) && !keys.includes(k);
      return `<tr data-k="${esc(k)}" class="${gone ? 'gone' : ''}"><td><code>${esc(k)}</code>${isNew ? ' <span class="tag">mới</span>' : ''}</td>
        <td><input class="fl" value="${esc(st.labels[k] || '')}" placeholder="${esc((FIELDS[k] || [k])[0])}"${gone ? ' disabled' : ''}></td>
        <td class="c"><input type="checkbox" class="fv"${st.vis[k] !== false ? ' checked' : ''}${gone ? ' disabled' : ''}></td>
        <td class="c">${isNew ? 0 : filled(k)}</td>
        <td class="c">${lock ? '🔒' : `<button class="ib fdel" title="${gone ? 'Bỏ xóa' : 'Xóa trường'}">${gone ? '↺' : svg(ICON.trash, 15)}</button>`}</td></tr>`;
    }).join('');
  };
  render();
  tb.addEventListener('input', e => { const tr = e.target.closest('tr'); if (!tr) return; const k = tr.dataset.k; if (e.target.classList.contains('fl')) st.labels[k] = e.target.value.trim(); });
  tb.addEventListener('change', e => { const tr = e.target.closest('tr'); if (tr && e.target.classList.contains('fv')) st.vis[tr.dataset.k] = e.target.checked; });
  tb.addEventListener('click', e => {
    const b = e.target.closest('.fdel'); if (!b) return;
    const k = b.closest('tr').dataset.k;
    if (st.added.some(a => a.k === k) && !keys.includes(k)) { st.added = st.added.filter(a => a.k !== k); delete st.labels[k]; }
    else if (st.del.has(k)) st.del.delete(k); else st.del.add(k);
    render();
  });
  card.querySelector('#faBtn').addEventListener('click', () => {
    const k = card.querySelector('#faKey').value.trim(), lb = card.querySelector('#faLabel').value.trim();
    err.hidden = true;
    if (!/^[A-Za-z][A-Za-z0-9_]{0,39}$/.test(k)) { err.textContent = 'Tên trường phải bắt đầu bằng chữ cái, chỉ gồm chữ không dấu, số và dấu _'; err.hidden = false; return; }
    if (keys.includes(k) || st.added.some(a => a.k === k)) { err.textContent = 'Trường này đã có'; err.hidden = false; return; }
    st.added.push({ k }); st.vis[k] = true; if (lb) st.labels[k] = lb;
    card.querySelector('#faKey').value = ''; card.querySelector('#faLabel').value = '';
    render();
  });
  card.addEventListener('click', async e => {
    const x = e.target.closest('[data-x]'); if (!x) return;
    if (x.dataset.x === 'cancel') { dlgClose(); return; }
    if (x.dataset.x === 'export') { download(def.id + '_da_sua.geojson', JSON.stringify({ type: 'FeatureCollection', name: def.id, features: def.feats.map(f => ({ type: 'Feature', id: oidOf(f), properties: f.properties, geometry: f.geometry })) }), 'application/geo+json'); return; }
    if (x.dataset.x !== 'save') return;
    const dels = [...st.del];
    if (dels.length && !(await confirmDlg('Xóa trường?', `Xóa ${dels.length} trường: <b>${dels.map(esc).join(', ')}</b> khỏi lớp “${esc(def.title)}” cho mọi người xem.`, 'Xóa và lưu'))) { admFieldsDlg(def); return; }
    const hide = new Set(c0.hide || []), show = new Set(c0.show || []);
    Object.entries(st.vis).forEach(([k, v]) => {
      if (st.del.has(k) || v === vis0[k]) return;
      if (v) { hide.delete(k); show.add(k); } else { show.delete(k); hide.add(k); }
    });
    const labels = {}; Object.entries(st.labels).forEach(([k, v]) => { if (v && !st.del.has(k)) labels[k] = v; });
    const cfg = { labels, hide: [...hide].filter(k => !st.del.has(k)), show: [...show].filter(k => !st.del.has(k)), added: st.added.filter(a => !st.del.has(a.k)), removed: [...new Set([...st.removed, ...dels])].filter(k => !st.added.some(a => a.k === k)) };
    try { await dbFetch('/rest/v1/layer_schema?on_conflict=layer_id', { method: 'POST', auth: true, prefer: 'resolution=merge-duplicates,return=minimal', body: [{ layer_id: def.id, cfg }] }); }
    catch (ex) { if ($('dlg').hidden) admFieldsDlg(def); toast('Không lưu được: ' + ex.message); return; }
    DB.schema[def.id] = cfg;
    applySchema(def, def.feats);
    dlgClose(); admRefreshLayer(def);
    if (INFO.hits.some(h => h.def === def)) openInfo(INFO.ll, INFO.hits);
    toast('Đã lưu cấu hình trường');
  });
}
$('aFields').addEventListener('click', () => A.def && admFieldsDlg(A.def));
admRestore();

main();
</script>
